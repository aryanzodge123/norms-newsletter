<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Norm's Newsletter &middot; Read less. Miss nothing.</title>
    <meta
      name="description"
      content="A paper, printed for one. Built to be finished: no feed, no infinite scroll."
    />
    <link rel="canonical" href="https://norm.news/" />

    <!-- The mug is the site's brand glyph (DESIGN.md section 10), copied from
         site/public rather than redrawn. apple-touch-icon.png comes from
         `npm run icon`; og.png is a supplied image and is not generated. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- One value, not a light/dark pair: the palette follows the delivery dial
         the visitor sets, not prefers-color-scheme. -->
    <meta name="theme-color" content="#f6f4ee" />

    <!-- Absolute URLs, because Open Graph requires them. This is the only file
         in landing/ that names the domain. -->
    <meta property="og:site_name" content="Norm's Newsletter" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Norm's Newsletter · Read less. Miss nothing." />
    <meta
      property="og:description"
      content="A paper, printed for one. Built to be finished: no feed, no infinite scroll."
    />
    <meta property="og:url" content="https://norm.news/" />
    <!-- ?v= is a cache buster, not a file. Facebook, LinkedIn and Twitter key
         their scraped copy of the card on the URL, so replacing the bytes at
         the same path leaves the old picture in circulation for a long time.
         Bump this whenever public/og.png changes. -->
    <meta property="og:image" content="https://norm.news/og.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Norm's Newsletter: a steaming mug beside the word Norm." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Norm's Newsletter · Read less. Miss nothing." />
    <meta
      name="twitter:description"
      content="A paper, printed for one. Built to be finished: no feed, no infinite scroll."
    />
    <meta name="twitter:image" content="https://norm.news/og.png?v=2" />
    <meta name="twitter:image:alt" content="Norm's Newsletter: a steaming mug beside the word Norm." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
