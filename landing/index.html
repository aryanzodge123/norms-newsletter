<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Norm&rsquo;s Newsletter &middot; A daily news briefing, built to be finished</title>
    <meta
      name="description"
      content="A personal daily news briefing. Choose your topics and your length, and Norm builds one edition at your delivery time, every story linked to its sources."
    />
    <link rel="canonical" href="https://norm.news/" />

    <!-- The mug is the site's brand glyph (DESIGN.md section 10), copied from
         site/public rather than redrawn. apple-touch-icon.png comes from
         `npm run icon`; og.png is a supplied image and is not generated. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- One value, not a light/dark pair: the palette follows the delivery dial
         the visitor sets, not prefers-color-scheme. -->
    <meta name="theme-color" content="#f6f4ee" />

    <!-- Absolute URLs, because Open Graph requires them. Two files in landing/
         name the domain in source: this one, and scripts/prerender.mjs, which
         holds the SITE_ORIGIN every generated file derives from. wrangler.toml
         holds it as deploy configuration. -->
    <meta property="og:site_name" content="Norm's Newsletter" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Norm's Newsletter · A daily news briefing, built to be finished" />
    <meta
      property="og:description"
      content="A personal daily news briefing. Choose your topics and your length, and Norm builds one edition at your delivery time, every story linked to its sources."
    />
    <meta property="og:url" content="https://norm.news/" />
    <!-- ?v= is a cache buster, not a file. Facebook, LinkedIn and Twitter key
         their scraped copy of the card on the URL, so replacing the bytes at
         the same path leaves the old picture in circulation for a long time.
         Bump this whenever public/og.png changes. -->
    <meta property="og:image" content="https://norm.news/og.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Norm's Newsletter: a steaming mug beside the word Norm." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Norm's Newsletter · A daily news briefing, built to be finished" />
    <meta
      name="twitter:description"
      content="A personal daily news briefing. Choose your topics and your length, and Norm builds one edition at your delivery time, every story linked to its sources."
    />
    <meta name="twitter:image" content="https://norm.news/og.png?v=2" />
    <meta name="twitter:image:alt" content="Norm's Newsletter: a steaming mug beside the word Norm." />

    <!-- Every element on the page starts at opacity 0 and is revealed by
         script (.impress, .reveal in index.css). The markup is prerendered, so
         without this a visitor with JavaScript off receives a complete document
         and sees a blank screen. Important author declarations beat animation
         declarations in the cascade, which is what defeats the `forwards` fill.
         The interactive parts render in their initial state and do nothing when
         operated. A readable page with inert controls beats no page.
         PROPOSED-SPEC-DISCOVERY.md section 15.2. -->
    <noscript>
      <style>
        .impress,
        .reveal {
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
