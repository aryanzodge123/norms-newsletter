<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How do you get your news? &middot; Norm&rsquo;s Newsletter</title>
    <meta
      name="description"
      content="Search, feeds, newsletters and apps all get you the news. Almost none of them ever tell you when you&rsquo;re done."
    />
    <link rel="canonical" href="https://norm.news/blog/how-do-you-get-your-news" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The morning paper. This page carries no delivery dial, so like /faq
         and /blog the value here is the palette the visitor actually gets. -->
    <meta name="theme-color" content="#f6f4ee" />

    <!-- Absolute URLs, because Open Graph requires them. Every *generated* self
         URL still comes from SITE_ORIGIN in scripts/prerender.mjs. See
         README.md. -->
    <meta property="og:site_name" content="Norm's Newsletter" />
    <meta property="og:type" content="article" />
    <meta property="article:published_time" content="2026-09-19" />
    <meta property="article:author" content="Aryan Zodge" />
    <meta property="og:title" content="How do you get your news?" />
    <meta
      property="og:description"
      content="Search, feeds, newsletters and apps all get you the news. Almost none of them ever tell you when you&rsquo;re done."
    />
    <meta property="og:url" content="https://norm.news/blog/how-do-you-get-your-news" />
    <!-- Shares the front page's card. Bump ?v= with public/og.png, in all
         five files together: the scrapers key their copy on the URL. -->
    <meta property="og:image" content="https://norm.news/og.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Norm's Newsletter: a steaming mug beside the word Norm." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="How do you get your news?" />
    <meta
      name="twitter:description"
      content="Search, feeds, newsletters and apps all get you the news. Almost none of them ever tell you when you&rsquo;re done."
    />
    <meta name="twitter:image" content="https://norm.news/og.png?v=2" />
    <meta name="twitter:image:alt" content="Norm's Newsletter: a steaming mug beside the word Norm." />

    <!-- Same reveal defeat as the other pages: every element starts at
         opacity 0 and is revealed by script, so without this a visitor with
         JavaScript off receives a complete document and sees a blank screen.

         The nav rule is the header's. The hamburger is the one control here
         that does nothing without JavaScript, so it is hidden and the real
         links are shown in its place. -->
    <noscript>
      <style>
        .impress,
        .reveal {
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
        }
        .nav-toggle {
          display: none !important;
        }
        .site-nav {
          display: flex !important;
          flex-wrap: wrap;
          justify-content: flex-end;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-post-how-do-you-get-your-news.jsx"></script>
  </body>
</html>
