<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Responsive check</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #2b2b28; color: #ecebe3;
             font: 12px/1.3 ui-monospace, monospace; overflow: hidden; }
      #stage { display: flex; gap: 18px; align-items: flex-start;
               transform: scale(1.35); transform-origin: top left; padding: 8px; }
      figure { margin: 0; }
      figcaption { padding: 4px 0 6px; letter-spacing: .1em; text-transform: uppercase; }
      iframe { border: 0; background: #f6f4ee; display: block; height: 940px; }
    </style>
  </head>
  <body>
    <div id="stage">
      <figure><figcaption>1440 · desktop</figcaption><iframe id="a" src="/" style="width:1440px"></iframe></figure>
      <figure><figcaption>900 · tablet</figcaption><iframe id="b" src="/" style="width:900px"></iframe></figure>
      <figure><figcaption>390 · phone</figcaption><iframe id="c" src="/" style="width:390px"></iframe></figure>
    </div>
    <script>
      window.scrollAll = (y) =>
        ['a','b','c'].map((id) => {
          const w = document.getElementById(id).contentWindow
          w.scrollTo({ top: y, behavior: 'instant' })
          return id + ':' + w.scrollY
        }).join(' ')
      window.zoom = (s) => { document.getElementById('stage').style.transform = 'scale(' + s + ')'; return s }
    </script>
  </body>
</html>
