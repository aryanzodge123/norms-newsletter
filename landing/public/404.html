<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found &middot; Norm's Newsletter</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#f6f4ee" />

    <!-- This file's real job is not to be read. Cloudflare Pages treats a site
         with no top-level 404.html as a single-page application and answers
         every unmatched path with index.html and a 200. That is wrong here:
         the page is one screen with anchor links and has no client-side
         router, so nothing needs the fallback, and it made a missing asset
         indistinguishable from a working one. A request for a stylesheet that
         no longer exists came back as HTML, the browser dropped it on the MIME
         mismatch without an error, and the page rendered with no styling at
         all. Its existence is what makes that a 404 instead.

         Styles are inline and the type falls to Georgia on purpose. A page
         that exists to be shown when a file is missing should not depend on
         two more files being present. -->
    <style>
      :root {
        --paper: #f6f4ee;
        --ink: #23231f;
        --ink-soft: #44433c;
        --muted: #6b6a62;
        --oxide: #3f6a50;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: var(--paper);
        color: var(--ink);
        font-family: Newsreader, Georgia, 'Times New Roman', serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 46ch;
      }
      .eyebrow {
        margin: 0 0 18px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 0 0 18px;
        font-weight: 500;
        font-size: clamp(30px, 6vw, 42px);
        line-height: 1.14;
        letter-spacing: -0.012em;
      }
      p {
        margin: 0 0 26px;
        font-size: 19px;
        line-height: 1.62;
        color: var(--ink-soft);
      }
      hr {
        border: 0;
        border-top: 1px solid var(--ink);
        margin: 0 0 26px;
      }
      a {
        color: var(--oxide);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <hr />
      <h1>That page is not here.</h1>
      <p>
        The link may be out of date, or the address may have a typo in it. Nothing is broken on our
        end.
      </p>
      <p><a href="/">Back to the front page</a></p>
    </main>
  </body>
</html>
